<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iOS17 聊天室 · 微信式</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聊天室">
<style>
/* ═══════════════════════════════════════════
   变量 & 主题
═══════════════════════════════════════════ */
:root{
 --bg1:#e0c3fc;--bg2:#c8b6ff;--bg3:#b19cd9;--bg4:#9d81ba;
 --card-bg:rgba(255,255,255,0.2);--card-border:rgba(255,255,255,0.25);
 --text:#333;--mask:rgba(0,0,0,0.18);--primary:#8b5cf6;
 --success:#34c759;--danger:#ff3b30;--warn:#ff9500;
 --tab-bar-bg:rgba(255,255,255,0.25);
 --msg-other-bg:rgba(255,255,255,0.4);
 --input-bg:rgba(255,255,255,0.25);
 --sep-border:rgba(255,255,255,0.15);
 --list-item-bg:rgba(255,255,255,0.1);
 --chat-bg:rgba(255,255,255,0.15);
 --session-item-bg:rgba(255,255,255,0.18);
 --session-item-hover:rgba(255,255,255,0.3);
}
body.dark-mode{
 --bg1:#1a1035;--bg2:#231c42;--bg3:#2a1f4a;--bg4:#311a52;
 --card-bg:rgba(255,255,255,0.08);--card-border:rgba(255,255,255,0.12);
 --text:#eee;--mask:rgba(0,0,0,0.55);
 --tab-bar-bg:rgba(0,0,0,0.3);
 --msg-other-bg:rgba(255,255,255,0.12);
 --input-bg:rgba(255,255,255,0.1);
 --sep-border:rgba(255,255,255,0.08);
 --list-item-bg:rgba(255,255,255,0.06);
 --chat-bg:rgba(0,0,0,0.2);
 --session-item-bg:rgba(255,255,255,0.06);
 --session-item-hover:rgba(255,255,255,0.12);
}
body{
 overflow:hidden;
 background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
 background-size:400% 400%;animation:bgG 12s ease infinite;
 min-height:100vh;
}
@keyframes bgG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ═══════════════════════════════════════════
   全局
═══════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
button{border:none;outline:none;cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}

/* ═══════════════════════════════════════════
   顶部状态栏
═══════════════════════════════════════════ */
.top-bar{
 position:fixed;top:0;left:0;width:100%;height:50px;padding:0 16px;
 display:flex;align-items:center;z-index:80;
 background:var(--card-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
 border-bottom:1px solid var(--card-border);color:var(--text);
 padding-top:env(safe-area-inset-top);
}
.top-bar .back-btn{font-size:22px;margin-right:10px;background:none;color:var(--text);padding:4px}
.top-bar .top-title{flex:1;font-size:16px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-bar .top-right{display:flex;gap:6px;font-size:18px}
.top-bar .top-right button{background:none;font-size:18px;color:var(--text);padding:4px}

.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);flex-shrink:0}
.dot.offline{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.dot.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status-text{font-size:12px;opacity:.6;margin-left:6px}

/* ═══════════════════════════════════════════
   主布局（Tab 式）
═══════════════════════════════════════════ */
.app-root{
 width:100vw;
 height:100vh;
 display:flex;
 flex-direction:column;
}

/* Tab 页面 */
.tab-page{
 flex:1;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

/* ═══════════════════════════════════════════
   Tab 1: 微信（会话列表）
═══════════════════════════════════════════ */
.session-list{
 flex:1;
 overflow-y:auto;
 padding:6px 0;
}
.session-item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 14px;
 cursor:pointer;
 transition:background .15s;
 border-radius:0;
 position:relative;
}
.session-item:hover{background:var(--session-item-hover)}
.session-item:active{background:var(--session-item-hover)}
.session-item::after{
 content:"";position:absolute;bottom:0;left:64px;right:0;height:1px;
 background:var(--sep-border);
}
.session-avatar{
 width:48px;height:48px;border-radius:8px;
 background:var(--primary);color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:22px;flex-shrink:0;
 position:relative;
}
.session-avatar .avatar-icon{font-size:24px}
.session-avatar .unread-badge{
 position:absolute;top:-4px;right:-4px;
 min-width:18px;height:18px;border-radius:9px;
 background:var(--danger);color:#fff;
 font-size:11px;display:flex;align-items:center;justify-content:center;
 padding:0 4px;font-weight:600;
}
.session-info{flex:1;min-width:0}
.session-name{font-size:15px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-preview{font-size:12px;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-meta{text-align:right;flex-shrink:0}
.session-time{font-size:11px;opacity:.45;display:block;margin-bottom:2px}
.session-type-tag{
 font-size:9px;background:rgba(139,92,246,.2);color:var(--primary);
 padding:2px 5px;border-radius:4px;margin-right:4px;
}

/* ═══════════════════════════════════════════
   Tab 2: 通讯录
═══════════════════════════════════════════ */
.contact-page{
 flex:1;overflow-y:auto;padding:10px 0;
}
.contact-section{margin-bottom:16px}
.contact-section-title{
 font-size:12px;color:var(--text);opacity:.5;
 padding:6px 16px;background:transparent;
 text-align:left;
}
.contact-card{
 display:flex;align-items:center;gap:10px;
 padding:10px 16px;
 background:var(--card-bg);margin:0 10px 2px;
 border-radius:12px;
 cursor:pointer;
 transition:background .15s;
}
.contact-card:hover{background:var(--session-item-hover)}
.contact-card:active{background:var(--session-item-hover)}
.contact-card .avatar{
 width:40px;height:40px;border-radius:8px;
 background:var(--primary);color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:18px;flex-shrink:0;
}
.contact-card .cname{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 5px var(--success)}
.online-dot.offline{background:#aaa;box-shadow:none}

.group-card{
 display:flex;align-items:center;gap:10px;
 padding:10px 16px;
 background:var(--card-bg);margin:0 10px 2px;
 border-radius:12px;
 cursor:pointer;
 transition:background .15s;
}
.group-card:hover{background:var(--session-item-hover)}
.group-card .avatar{width:40px;height:40px;border-radius:8px;background:#8b5cf6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.group-card .gname{flex:1;font-size:14px}
.group-card .gcount{font-size:12px;opacity:.5}

/* ═══════════════════════════════════════════
   Tab 3: 我（设置）
═══════════════════════════════════════════ */
.profile-page{
 flex:1;overflow-y:auto;padding:0;
}
.profile-header{
 padding:20px 16px 16px;
 background:var(--card-bg);border-bottom:1px solid var(--card-border);
 display:flex;align-items:center;gap:14px;
}
.profile-avatar{
 width:64px;height:64px;border-radius:14px;
 background:var(--primary);color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:32px;
}
.profile-info{flex:1}
.profile-name{font-size:17px;font-weight:600;margin-bottom:4px}
.profile-status{font-size:12px;opacity:.5;display:flex;align-items:center;gap:6px}

.settings-group{
 margin:12px 10px;
 background:var(--card-bg);border-radius:14px;overflow:hidden;
}
.settings-item{
 display:flex;align-items:center;justify-content:space-between;
 padding:13px 14px;
 border-bottom:1px solid var(--sep-border);
 cursor:pointer;
 transition:background .15s;
}
.settings-item:last-child{border-bottom:none}
.settings-item:hover{background:var(--session-item-hover)}
.settings-item:active{background:var(--session-item-hover)}
.settings-item .si-label{font-size:14px;display:flex;align-items:center;gap:8px}
.settings-item .si-icon{font-size:18px}
.settings-item .si-desc{font-size:11px;opacity:.5;margin-top:1px}
.settings-item .si-value{font-size:13px;opacity:.5;margin-right:6px}
.settings-item .si-arrow{font-size:14px;opacity:.4}

.bg-preview-grid{
 display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;
}
.bg-preview-item{
 height:50px;border-radius:8px;cursor:pointer;
 border:2px solid transparent;transition:border .2s;
 overflow:hidden;display:flex;align-items:center;justify-content:center;
 font-size:11px;color:#fff;opacity:.8;
}
.bg-preview-item.selected{border-color:var(--primary)}
.bg-preview-item img{width:100%;height:100%;object-fit:cover}

/* ═══════════════════════════════════════════
   聊天窗口
═══════════════════════════════════════════ */
.chat-view{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
 background-size:400% 400%;animation:bgG 12s ease infinite;
 z-index:200;
 display:flex;flex-direction:column;
 transform:translateX(100%);
 transition:transform .3s cubic-bezier(.2,0,.2,1);
}
.chat-view.open{transform:translateX(0)}
.chat-view.chat-bg-image{
 background:transparent !important;
}
.chat-view.chat-bg-image::before{
 content:"";position:fixed;top:0;left:0;width:100%;height:100%;
 z-index:0;
}

.chat-messages{
 flex:1;overflow-y:auto;padding:8px 10px;
 padding-top:calc(50px + env(safe-area-inset-top));
 padding-bottom:calc(56px + env(safe-area-inset-bottom));
 position:relative;z-index:1;
}
.msg-wrap{
 display:flex;gap:8px;margin:4px 0;animation:pop .2s cubic-bezier(.2,0,.2,1);
}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.msg-wrap.self{flex-direction:row-reverse}
.msg-avatar{
 width:34px;height:34px;border-radius:6px;
 background:var(--primary);color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:14px;flex-shrink:0;align-self:flex-end;
}
.msg-body{max-width:74%}
.msg-bubble{
 padding:8px 12px;border-radius:16px;
 word-break:break-all;line-height:1.5;
 font-size:14px;position:relative;
}
.msg-self .msg-bubble{
 background:var(--primary);color:#fff;
 border-bottom-right-radius:4px;
}
.msg-other .msg-bubble{
 background:var(--msg-other-bg);color:var(--text);
 border-bottom-left-radius:4px;
 backdrop-filter:blur(15px);
}
.msg-user{font-size:11px;opacity:.6;margin-bottom:2px;font-weight:500}
.msg-content{white-space:pre-wrap}
.msg-revoked{font-style:italic;opacity:.5;font-size:12px;text-align:center;display:block;padding:4px 0}
.msg-meta{font-size:10px;opacity:.5;margin-top:2px;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.msg-img{max-width:220px;border-radius:12px;display:block;cursor:pointer}
.msg-file{
 display:flex;align-items:center;gap:8px;padding:8px 12px;
 background:rgba(255,255,255,.12);border-radius:10px;
 text-decoration:none;color:inherit;min-width:160px;
}
.msg-file-icon{font-size:22px;flex-shrink:0}
.msg-file-info{flex:1;min-width:0}
.msg-file-name{font-size:12px;word-break:break-all}
.msg-file-size{font-size:10px;opacity:.5}
.msg-sys{text-align:center;font-size:12px;opacity:.4;padding:6px 0;width:100%}

.date-sep{text-align:center;font-size:11px;opacity:.4;margin:10px 0 6px;position:relative}
.date-sep::before,.date-sep::after{content:"";position:absolute;top:50%;width:25%;height:1px;background:var(--card-border)}
.date-sep::before{left:0}.date-sep::after{right:0}

/* ═══════════════════════════════════════════
   聊天输入区
═══════════════════════════════════════════ */
.chat-input-bar{
 flex-shrink:0;z-index:10;
 background:var(--card-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
 border-top:1px solid var(--card-border);
 padding:6px 8px;
 padding-bottom:calc(6px + env(safe-area-inset-bottom));
 display:flex;gap:6px;align-items:flex-end;
 position:relative;z-index:1;
}
.chat-input-bar .voice-btn,.chat-input-bar .tool-btn{
 width:36px;height:36px;border-radius:50%;
 background:rgba(255,255,255,.15);border:none;color:var(--text);
 font-size:18px;display:flex;align-items:center;justify-content:center;
 flex-shrink:0;transition:background .15s;
}
.chat-input-bar .voice-btn:active,.chat-input-bar .tool-btn:active{background:rgba(255,255,255,.3)}
.chat-input-bar .voice-btn.active{background:var(--primary);color:#fff}
.chat-input-bar textarea{
 flex:1;border-radius:20px;border:none;outline:none;
 padding:8px 14px;font-size:14px;line-height:1.4;
 background:var(--input-bg);color:var(--text);resize:none;
 max-height:100px;min-height:36px;
 backdrop-filter:blur(15px);
}
.chat-input-bar textarea::placeholder{opacity:.4}
.chat-input-bar .send-btn{
 width:36px;height:36px;border-radius:50%;
 background:var(--primary);border:none;color:#fff;
 font-size:16px;display:none;align-items:center;justify-content:center;
 flex-shrink:0;
}

/* Emoji / + 面板 */
.chat-panel{
 display:none;flex-direction:column;
 background:var(--card-bg);backdrop-filter:blur(30px);
 border-top:1px solid var(--card-border);
 padding:8px;
 flex-shrink:0;
}
.chat-panel.show{display:flex}
.chat-panel .ep-tabs{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;flex-shrink:0}
.chat-panel .ep-tab{padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:none;color:var(--text);font-size:11px;cursor:pointer;flex-shrink:0}
.chat-panel .ep-tab.on{background:var(--primary);color:#fff}
.chat-panel .ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;overflow-y:auto;max-height:160px}
.chat-panel .ep-grid span{font-size:20px;text-align:center;cursor:pointer;padding:4px 0;border-radius:6px;transition:background .15s;line-height:1}
.chat-panel .ep-grid span:active{background:rgba(139,92,246,.3)}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px}
.plus-grid .plus-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;border:none;color:var(--text);font-size:11px;transition:transform .15s;font-family:inherit}
.plus-grid .plus-item:active{transform:scale(.92)}
.plus-grid .plus-item .ico{width:38px;height:38px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 4px 10px rgba(139,92,246,.35)}

/* ═══════════════════════════════════════════
   底部 Tab 栏
═══════════════════════════════════════════ */
.tab-bar{
 display:flex;flex-shrink:0;
 background:var(--card-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
 border-top:1px solid var(--card-border);
 padding-bottom:env(safe-area-inset-bottom);
}
.tab-bar .tab-item{
 flex:1;display:flex;flex-direction:column;align-items:center;
 padding:6px 0;
 cursor:pointer;border:none;background:none;color:var(--text);
 transition:opacity .15s;
}
.tab-bar .tab-item .tab-icon{font-size:22px;margin-bottom:2px;display:block}
.tab-bar .tab-item .tab-label{font-size:10px;opacity:.6}
.tab-bar .tab-item.active{color:var(--primary)}
.tab-bar .tab-item .unread-dots{
 position:relative;
}
.tab-bar .tab-item .red-dot{
 position:absolute;top:-4px;right:-8px;
 width:8px;height:8px;border-radius:50%;
 background:var(--danger);
}

/* ═══════════════════════════════════════════
   搜索框
═══════════════════════════════════════════ */
.search-bar{
 padding:8px 12px;
 background:var(--card-bg);border-bottom:1px solid var(--card-border);
 flex-shrink:0;
}
.search-input-wrap{
 display:flex;align-items:center;gap:8px;
 background:var(--input-bg);border-radius:10px;
 padding:7px 12px;
}
.search-input-wrap input{
 flex:1;border:none;outline:none;background:transparent;
 font-size:13px;color:var(--text);
}
.search-input-wrap input::placeholder{opacity:.4}
.search-input-wrap .si-icon{font-size:14px;opacity:.5}

/* ═══════════════════════════════════════════
   搜索结果页面
═══════════════════════════════════════════ */
.search-results{
 flex:1;overflow-y:auto;padding:0;
}
.search-result-item{
 padding:10px 14px;
 border-bottom:1px solid var(--sep-border);
 cursor:pointer;
 transition:background .15s;
}
.search-result-item:hover{background:var(--session-item-hover)}
.search-result-item .sri-session{font-size:11px;opacity:.5;margin-bottom:3px}
.search-result-item .sri-content{font-size:13px;line-height:1.5}
.search-result-item .sri-content mark{background:rgba(255,200,0,.4);border-radius:2px;padding:0 1px}

/* ═══════════════════════════════════════════
   建群 / 加人
═══════════════════════════════════════════ */
.select-contact-page{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:var(--bg1);z-index:300;
 display:flex;flex-direction:column;
 transform:translateX(100%);
 transition:transform .3s cubic-bezier(.2,0,.2,1);
}
.select-contact-page.open{transform:translateX(0)}
.select-contact-page .top-bar{justify-content:space-between}
.sc-list{flex:1;overflow-y:auto;padding:6px 0}
.sc-item{
 display:flex;align-items:center;gap:10px;
 padding:10px 14px;
 cursor:pointer;
 transition:background .15s;
}
.sc-item:hover{background:var(--session-item-hover)}
.sc-item .check-circle{
 width:22px;height:22px;border-radius:50%;
 border:2px solid rgba(255,255,255,.4);
 display:flex;align-items:center;justify-content:center;
 font-size:14px;flex-shrink:0;
 transition:background .2s;
}
.sc-item.selected .check-circle{background:var(--primary);border-color:var(--primary);color:#fff}
.sc-item .sc-avatar{width:40px;height:40px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.sc-item .sc-name{flex:1;font-size:14px}
.sc-footer{
 flex-shrink:0;padding:10px 14px;
 background:var(--card-bg);backdrop-filter:blur(30px);
 border-top:1px solid var(--card-border);
 padding-bottom:calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:10px;align-items:center;
}
.sc-footer input{flex:1;border-radius:12px;border:none;outline:none;padding:10px 14px;font-size:14px;background:var(--input-bg);color:var(--text)}
.sc-footer .btn{padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500}

/* ═══════════════════════════════════════════
   成员列表弹窗
═══════════════════════════════════════════ */
.member-panel{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:var(--mask);z-index:210;
 display:none;align-items:flex-end;
}
.member-panel.show{display:flex}
.member-panel-inner{
 width:100%;max-height:70vh;
 background:var(--card-bg);backdrop-filter:blur(30px);
 border-radius:18px 18px 0 0;
 overflow:hidden;
 padding-bottom:env(safe-area-inset-bottom);
 animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.member-panel-header{
 display:flex;align-items:center;justify-content:space-between;
 padding:14px 16px;border-bottom:1px solid var(--card-border);
 font-size:15px;font-weight:600;
}
.member-panel-header .close-btn{font-size:20px;opacity:.6;cursor:pointer}
.member-list{overflow-y:auto;max-height:60vh}
.member-list-item{
 display:flex;align-items:center;gap:10px;
 padding:10px 16px;
}
.member-list-item .ml-avatar{width:40px;height:40px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.member-list-item .ml-name{flex:1;font-size:14px}
.member-list-item .ml-owner{font-size:11px;color:var(--primary)}

/* ═══════════════════════════════════════════
   消息操作菜单
═══════════════════════════════════════════ */
.msg-menu{

const $ = id => document.getElementById(id);
const uid = () => "xxxxxxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&0x3|0x8)).toString(16);});
const esc = s => { if(!s)return""; const d=document.createElement("div"); d.textContent=s; return d.innerHTML; };

let username = localStorage.getItem("u") || "访客" + Math.floor(Math.random()*9000+1000);

// 在线状态

let pwaInstall = null;

// 视频
let localStream = null, beautyOn = false, muteOn = false;

// 表情包
const EMOJIS = {

 "🎉 物品": ["🔥","⭐","🌟","✨","💫","🎉","🎊","🎈","🎁","🏆","🥇","🎯","🎮","🎲","🎸","🎤","🎧","🎵","🎶","🎹","🎬","📷","📸","📹","🎥","📺","📻"],
 "🌿 自然": ["🌸","🌺","🌻","🌹","🌷","💐","🌾","🌱","🌿","☘","🍀","🌵","🌴","🌳","🌲","🍃","🍂","🍁","❄","🌨","🌧","⛈","🌩","🌪","🌈","☀️","🌙","⭐","🌟","💫"],

};

];

let isSearching = false;

 });

 // 公共区默认加载
 loadSession("public", "公共区", "public");
};

window.onbeforeunload = function(){
 if(isOnline) wsSend({t:"leave", u:username, room:currentRoom});
};

// ═══════════════════════════════════════════════════
//  WebSocket
// ═══════════════════════════════════════════════════
const WS_ENDPOINT = "wss://chatroom-worker.liul36198.workers.dev/ws";

function initWs(){
 if(ws) try{ws.close()}catch(e){}
 try{
  ws = new WebSocket(WS_ENDPOINT);
 }catch(e){
  setTimeout(initWs, 3000);
  return;
 }
 ws.onopen = () => {
  isOnline = true;
  wsSend({t:"join", u:username, room:currentRoom});
  startHeartbeat();
 };
 ws.onmessage = e => {
  try{
   const d = JSON.parse(e.data);
   handleWs(d);
  }catch(err){}
 };
 ws.onclose = () => {
  isOnline = false;
  clearTyping();
  stopHeartbeat();
  reconn = setTimeout(() => initWs(), 3000);
 };
 ws.onerror = () => { if(ws) ws.close(); };
}

function wsSend(d){ if(isOnline && ws.readyState===1) ws.send(JSON.stringify(d)); }

function startHeartbeat(){
 stopHeartbeat();
 heartbeat = setInterval(() => {
  if(ws && ws.readyState===1) ws.send(JSON.stringify({t:"ping", ts:Date.now()}));
 }, 25000);
}
function stopHeartbeat(){ clearInterval(heartbeat); }

function handleWs(d){
 switch(d.type){
  case "u_join":
   if(d.u !== username){
    appendSysMsg(`${d.u} 加入了${getRoomName(d.room)}`);
    if(isInChat && currentRoom === d.room) renderChat();
   }
   break;

  case "u_leave":
   if(d.u !== username){
    appendSysMsg(`${d.u} 离开了${getRoomName(d.room)}`);
    if(isInChat && currentRoom === d.room) renderChat();
   }
   break;

  case "history":
   if(!messages[d.room]) messages[d.room] = [];
   messages[d.room] = (d.msgs || []).map(m => ({...m, self: m.u === username}));
   saveMsgs();
   if(isInChat && currentRoom === d.room) renderChat();
   break;

  case "chat": case "img": case "file":
   if(!messages[d.room]) messages[d.room] = [];
   messages[d.room].push({...d.msg, self: d.msg.u === username});
   saveMsgs();
   updateSessionPreview(d.room, d.msg);
   if(isInChat && currentRoom === d.room){
    renderChat();
    if(!atBottom && !d.msg.self) { unread++; updateTabBadge(); }
    if(cfg.sound) playSound();
   }
   break;

  case "revoke":
   if(messages[d.room]){
    const idx = messages[d.room].findIndex(m => m.id === d.id);
    if(idx !== -1){
     messages[d.room][idx].type = "revoke";
     messages[d.room][idx].c = "【已撤回】";
     saveMsgs();
     if(isInChat && currentRoom === d.room) renderChat();
    }
   }
   break;

  case "del":
   if(messages[d.room]){
    const idx = messages[d.room].findIndex(m => m.id === d.id);
    if(idx !== -1){ messages[d.room].splice(idx,1); saveMsgs(); }
    if(isInChat && currentRoom === d.room) renderChat();
   }
   break;

  case "typing":
   if(d.u !== username){
    typingUsers[d.u] = Date.now();
    clearTimeout(typingT[d.u]);
    typingT[d.u] = setTimeout(() => { delete typingUsers[d.u]; }, 3000);
    if(isInChat && currentRoom === d.room) showTypingTip();
   }
   break;

  case "stop_typing":
   delete typingUsers[d.u];
   hideTypingTip();
   break;

  case "room_members":
   // 收到房间成员列表
   break;

  case "room_list":
   // 收到用户所在的房间列表，同步 sessions
   (d.rooms || []).forEach(r => {
    if(!sessions.find(s => s.id === r.id)){
     sessions.push({ id: r.id, name: r.name, type: r.id === "public" ? "public" : (r.id.startsWith("dm:") ? "dm" : "group"), unread: 0, lastMsg: "", lastTime: "" });
    }
   });
   saveSessions();
   renderSessions();
   break;

  case "dm_created": case "dm_ready":
   openDmRoom(d.room, d.target, d.targetName || d.target);
   break;

  case "group_created": case "group_joined":
   openGroupRoom(d.room, d.groupId, d.name || d.name, d.members || []);
   break;

  case "group_join":
   appendSysMsg(`${d.u} 加入了群聊`);
   if(isInChat && currentRoom === d.room) renderChat();
   break;

  case "notice":
   appendSysMsg(`📢 ${d.u}: ${d.c}`);
   break;

  case "announce":
   appendSysMsg(`📌 ${d.u} 发布了公告: ${d.title}`);
   break;

  case "pong": break;
 }
}

function getRoomName(room){
 if(room === "public") return "公共区";
 if(room.startsWith("dm:")){
  const parts = room.split(":");
  return parts.find(p => p !== username) || "私聊";
 }
 if(room.startsWith("group:")){
  return groups.find(g => "group:"+g.id === room)?.name || "群聊";
 }
 return room;
}

function makeDmRoom(userA, userB){
 return userA < userB ? `dm:${userA}:${userB}` : `dm:${userB}:${userA}`;
}

function openChat(roomId, roomName, roomType){
 if(currentRoom === roomId && isInChat) return;
 currentRoom = roomId;
 currentRoomName = roomName;
 currentRoomType = roomType;

 // 更新在线状态
 if(!messages[roomId]) messages[roomId] = [];
 saveMsgs();

 // 确保会话存在
 if(!sessions.find(s => s.id === roomId)){
  sessions.unshift({ id: roomId, name: roomName, type: roomType, unread: 0, lastMsg: "", lastTime: "" });
  saveSessions();
  renderSessions();
 }

 // 标记已读
 markRead(roomId);

 // 切换到聊天视图
 isInChat = true;
 updateTopBar();
 renderChat();

 $("chatView").classList.add("open");
 $("chatInputBar").style.display = "flex";

 // 隐藏主界面 tab bar
 $("mainTabBar").style.display = "none";

 // 如果是群聊，请求成员列表
 if(roomType === "group"){
  wsSend({t:"group_members", groupId: roomId.replace("group:","")});
 }

 // 发送 join（切换房间）
 wsSend({t:"join", u:username, room:roomId});
}

function closeChat(){
 isInChat = false;
 currentRoom = "public";
 markRead(currentRoom);
 $("chatView").classList.remove("open");
 $("mainTabBar").style.display = "flex";
 updateTopBar();
 renderSessions();
}

function goBack(){
 if(isSearching){ closeSearch(); return; }
 if(isInChat){ closeChat(); return; }
}

function openDmRoom(roomId, target, targetName){
 if(!sessions.find(s => s.id === roomId)){
  sessions.unshift({ id: roomId, name: targetName, type:"dm", target, unread:0, lastMsg:"", lastTime:"" });
  saveSessions();
 }
 if(!contacts.find(c => c.id === target)){
  contacts.push({ id:target, name:targetName, avatar:"" });
  saveContacts();
 }
 saveSessions();
 renderSessions();
 renderContactsPage();
 openChat(roomId, targetName, "dm");
}

function openGroupRoom(roomId, groupId, name, members){

  groups.push({ id:groupId, name, members });

 }
 if(!sessions.find(s => s.id === roomId)){
  sessions.unshift({ id:roomId, name, type:"group", groupId, unread:0, lastMsg:"", lastTime:"" });
  saveSessions();
 }
 saveSessions(); saveGroups();
 renderSessions();
 openChat(roomId, name, "group");
}

function updateSessionPreview(roomId, msg){

 if(s){
  s.lastMsg = msg.c || (msg.t === "img" ? "[图片]" : msg.fn ? "[文件]" : "...");
  s.lastTime = msg.t2 || new Date().toLocaleString("zh-CN");
  // 移到最前
  sessions = [s, ...sessions.filter(x => x.id !== roomId)];
  saveSessions();
  renderSessions();
 }
}

  list.innerHTML = `<div class="empty"><span class="empty-icon">💬</span>暂无会话<br>开始聊天吧</div>`;
  return;
 }

 list.innerHTML = ss.map(s => {
  const icon = s.type === "public" ? "🌐" : (s.type === "group" ? "👥" : "👤");
  const typeTag = s.type === "public" ? '<span class="session-type-tag">公共</span>' : (s.type === "group" ? '<span class="session-type-tag">群</span>' : "");
  return `<div class="session-item" onclick="openChat('${esc(s.id)}','${esc(s.name)}','${s.type}')" oncontextmenu="showSessionMenu(event,'${esc(s.id)}')">

   <div class="session-meta">

   </div>
  </div>`;
 }).join("");
}

function renderChat(){

  dom.innerHTML = `<div class="empty" id="chatEmpty">开始聊天吧</div>`;
  dom.scrollTop = dom.scrollHeight;
  return;
 }

 let html = "";
 let lastD = "";
 msgs.forEach(m => {
  const d = (m.t2 || "").split(" ")[0];
  if(d !== lastD){ html += `<div class="date-sep">${d}</div>`; lastD = d; }
  html += renderMsg(m);
 });

 dom.innerHTML = html;

function renderMsg(m){
 if(m._sys){
  return `<div class="msg-sys">${esc(m.c || "")}</div>`;
 }
 const rev = m.type === "revoke";
 const self = m.self;
 const avatar = getAvatarLetter(m.u);
 let content = "";
 if(rev){
  content = `<span class="msg-revoked">【已撤回】</span>`;
 } else if(m.t === "text"){
  content = `<span class="msg-content">${esc(m.c || "")}</span>`;
 } else if(m.t === "img"){
  content = `<img class="msg-img" src="${m.src}" loading="lazy" onclick="previewImg('${m.src}')">`;
 } else if(m.t === "file"){
  content = `<a class="msg-file" href="${m.src}" download="${esc(m.fn||"文件")}"><span class="msg-file-icon">📄</span><div class="msg-file-info"><div class="msg-file-name">${esc(m.fn||"文件")}</div></div></a>`;
 }
 const meta = `<div class="msg-meta">
  <span>${(m.t2||"").split(" ")[1]||""}</span>
  ${self ? (m.r?'<span style="opacity:.4">✓✓</span>':'<span style="opacity:.3">✓</span>') : ""}
 </div>`;

 const id = `msg-${m.id}`;
 return `<div id="${id}" class="msg-wrap ${self?"self":""}" oncontextmenu="showMsgMenu(event,'${m.id}')">
  <div class="msg-avatar">${avatar}</div>
  <div class="msg-body">
   ${!self && !rev ? `<div class="msg-user">${esc(m.u)}</div>` : ""}
   <div class="msg-bubble">${content}</div>
   ${meta}
  </div>
 </div>`;
}

}

  // 语音输入（浏览器 Web Speech API）
  if("webkitSpeechRecognition" in window || "SpeechRecognition" in window){
   try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    window._sr = new SR();
    window._sr.lang = "zh-CN";
    window._sr.onresult = ev => {
     const transcript = ev.results[0][0].transcript;
     $("chatTextarea").value += transcript;
     onChatInput();
    };
    window._sr.onerror = () => {};
    window._sr.start();
    ta.placeholder = "语音输入中...";
    ta.disabled = true;
    $("voiceBtn").classList.add("active");
    showToast("🎙️ 语音输入中...");
    setTimeout(() => {
     if(window._sr) window._sr.stop();
     ta.disabled = false;
     ta.placeholder = "说点什么...";
     $("voiceBtn").classList.remove("active");
     voiceMode = false;
    }, 10000);
   } catch(err){ ta.style.display = "block"; ta.disabled = false; }
  } else {
   ta.style.display = "none";
   showToast("浏览器不支持语音识别");
  }
 } else {
  if(window._sr) try{window._sr.stop();}catch(e){}
  ta.style.display = "block";
  ta.disabled = false;
  ta.placeholder = "说点什么...";
  $("voiceBtn").classList.remove("active");
 }
}

function doGlobalSearch(){
 const q = $("globalSearchInput").value.trim().toLowerCase();
 const results = $("searchResults");
 if(!q){ results.innerHTML = '<div class="empty">输入关键字搜索</div>'; return; }

 let hits = [];
 Object.entries(messages).forEach(([roomId, msgs]) => {
  const roomName = getRoomName(roomId);
  (msgs || []).forEach(m => {
   if(m.t === "text" && (m.c || "").toLowerCase().includes(q)){
    hits.push({ roomId, roomName, msg: m });
   }
  });
 });

 if(hits.length === 0){ results.innerHTML = `<div class="empty">未找到「${esc(q)}」相关消息</div>`; return; }

 results.innerHTML = hits.map(h => {
  const preview = (h.msg.c || "").replace(new RegExp(`(${q})`, "gi"), "<mark>$1</mark>");
  return `<div class="search-result-item" onclick="openChatFromSearch('${esc(h.roomId)}','${esc(h.roomName)}')">
   <div class="sri-session">${esc(h.roomName)} · ${h.msg.u} · ${h.msg.t2||""}</div>
   <div class="sri-content">${preview}</div>
  </div>`;
 }).join("");
}

function openChatFromSearch(roomId, roomName){
 const s = sessions.find(s => s.id === roomId);
 const roomType = s?.type || (roomId === "public" ? "public" : (roomId.startsWith("dm:") ? "dm" : "group"));

 openChat(roomId, roomName, roomType);
}

function applyUserBg(){
 // 重置背景
 document.body.style.backgroundImage = "";
 document.body.style.background = "";

 if(!userBg.value){
  // 默认紫色渐变
  document.body.style.background = "linear-gradient(-45deg,#e0c3fc,#c8b6ff,#b19cd9,#9d81ba)";
  document.body.style.backgroundSize = "400% 400%";
  return;
 }

 if(userBg.type === "color"){
  if(userBg.value.startsWith("gradient:")){
   const parts = userBg.value.replace("gradient:","").split(":");
   document.body.style.background = `linear-gradient(${parts[0]},${parts.slice(1).join(",")})`;
   document.body.style.backgroundSize = "400% 400%";
   document.body.style.animation = "bgG 12s ease infinite";
  } else {
   document.body.style.background = userBg.value;
   document.body.style.animation = "none";
  }
 } else if(userBg.type === "image"){
  document.body.style.backgroundImage = `url(${userBg.value})`;
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.animation = "none";
 }
}

function playSound(){
 try{
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = 880; g.gain.setValueAtTime(.1, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .15);
  o.start(); o.stop(ctx.currentTime + .15);
 }catch(e){}
}

//  粒子
// ═══════════════════════════════════════════════════
let pc, px, pW, pH, pts = [];
function rw(){ if(!pc) return; pW = pc.width = innerWidth; pH = pc.height = innerHeight; }
function initParticle(){
 pc = $("particleCanvas"); if(!pc) return;
 px = pc.getContext("2d"); rw();
 addEventListener("resize", rw);
 pts = Array.from({length:60}, () => new Pt());
 (function lp(){
  if(!px) return;
  px.clearRect(0, 0, pW, pH);
  pts.forEach(p => { p.u(); p.d(); });
  if(pts[0]?.a > 0) requestAnimationFrame(lp);
  else if(pc) pc.style.display = "none";
 })();
}
class Pt{
 constructor(){
  this.x = Math.random()*pW; this.y = Math.random()*pH;
  this.sz = Math.random()*8+3;
  this.sx = (pW/2-this.x)*.018; this.sy = (pH/2-this.y)*.018;
